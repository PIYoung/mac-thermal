name: Bug report
description: Report a reproducible problem
labels: [bug]
body:
  - type: markdown
    attributes:
      value: "Do not include tokens, private process names, personal paths or sensitive screenshots."
  - type: input
    id: version
    attributes:
      label: Mac Thermal version
      placeholder: v2.4.0
    validations:
      required: true
  - type: input
    id: hardware
    attributes:
      label: Mac chip and macOS version
      placeholder: Apple M4 Pro, macOS 26
    validations:
      required: true
  - type: textarea
    id: reproduce
    attributes:
      label: Steps to reproduce and expected behavior
    validations:
      required: true
  - type: textarea
    id: observed
    attributes:
      label: What happened
    validations:
      required: true
